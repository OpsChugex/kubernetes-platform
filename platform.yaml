apiVersion: v1
kind: Namespace
metadata: { name: reference-platform }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: evidence-demo, namespace: reference-platform }
spec:
  replicas: 2
  selector: { matchLabels: { app: evidence-demo } }
  template:
    metadata: { labels: { app: evidence-demo } }
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 10 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: reference-platform }
spec: { podSelector: {}, policyTypes: ["Ingress", "Egress"] }